name: Publicera adminportal

# Manuell, separat publicering av adminappen. Den påverkar inte den publika
# deploy-workflowen och får inte köras förrän Easy Auth, Owner/Staff-roller,
# MFA och Storage Table Data Reader är verifierade i Azure.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-portal-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  APP_NAME: 'hemsida-skadevi-admin-prod'
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  test:
    name: Testa och paketera admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installera beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tester
        run: npm test
      - name: Bygg separat adminpaket
        run: npm run package:admin
      - name: Smoke-testa adminpaketet
        run: npm run smoke:admin

  deploy:
    name: Publicera till admin-App Service
    needs: test
    runs-on: ubuntu-latest
    # Kräver att GitHub-miljön admin-prod har skyddade godkännanden.
    environment: admin-prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Kontrollera OIDC-konfiguration
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::GitHub-variablerna AZURE_CLIENT_ID, AZURE_TENANT_ID och AZURE_SUBSCRIPTION_ID saknas."
            exit 1
          fi
      - name: Installera beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bygg separat adminpaket
        run: npm run package:admin
      - name: Logga in på Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Publicera endast adminpaketet
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: 'package-admin'
