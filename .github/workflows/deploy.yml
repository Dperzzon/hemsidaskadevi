name: Deploy till Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appservice-deploy-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Ska matcha webAppName i infra/main.bicepparam.
  APP_NAME: 'hemsida-skadevi-prod'
  # User-assigned managed identity, klient och prenumeration som skapats via
  # infra/main.bicep (output githubIdentityClientId). Lägg till som
  # repo-variabler/secrets i GitHub-inställningarna, se docs/driftsattning.md.
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  test:
    name: Test och statisk analys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installera beroenden (reproducerbart)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Statisk analys (ESLint)
        run: npm run lint
      - name: Enhetstester (server, kalender-API, kalenderklient)
        run: npm test
      - name: Bygg frontend med Vite
        run: npm run build
      - name: Installera Playwright-webbläsare
        run: npx playwright install --with-deps chromium
      - name: Funktionella E2E-tester mot paketerad app
        run: npx playwright test --grep-invert "@visual" --project=desktop
      - name: Kontrollera att alla sidor och resurser byggs
        run: |
          set -e
          for page in index 404 pages/foretag pages/fest pages/brollop pages/semester pages/boende pages/aktiviteter pages/priser pages/mat-dryck pages/om-oss pages/vanliga-fragor pages/kontakt pages/digital-visning pages/boka pages/lediga-datum; do
            test -f "dist/${page}.html" || { echo "::error::Saknas i bygget: dist/${page}.html"; exit 1; }
          done
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/images/logo.png
          test -f dist/fonts/v20-UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2
          # Alla HTML-sidor ska referera existerande hashade resurser.
          node scripts/verify-dist.mjs

  build_and_deploy:
    name: Bygg och driftsätt
    needs: test
    runs-on: ubuntu-latest
    # id-token: write krävs för OIDC-tokenutbytet mot Azure (federated
    # identity credential). contents: read för checkout.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera OIDC-konfiguration
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::GitHub-variablerna AZURE_CLIENT_ID, AZURE_TENANT_ID och AZURE_SUBSCRIPTION_ID saknas. Kör infra-deploymenten (den skapar id-github-actions-skadevi via OIDC) och lägg till clientId som AZURE_CLIENT_ID samt tenant-/prenumerations-ID som AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID i repo-inställningarna, se docs/driftsattning.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installera beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bygg frontend med Vite (hashade resurser + förkomprimering)
        run: npm run build
      - name: Verifiera bygget
        run: node scripts/verify-dist.mjs
      - name: Paketera endast produktionsfilerna
        run: |
          set -e
          mkdir -p package/server package/dist
          cp package.json package-lock.json package/
          cp server/index.js package/server/
          # Innehållskopiering: mål-KATALOGEN finns redan, så "cp -r src dst"
          # skulle skapa package/dist/dist (bekräftat fel i CI på Linux).
          cp -r server/calendar/. package/server/calendar/
          cp -r dist/. package/dist/
          # Regressionskontroll: felaktigt paketerat bygge får aldrig nå Azure.
          test -f package/dist/index.html || { echo "::error::package/dist/index.html saknas — paketeringen är felaktig"; exit 1; }
          test -f package/dist/pages/priser.html || { echo "::error::package/dist/pages saknas — paketeringen är felaktig"; exit 1; }
          test -f package/server/calendar/availability.js || { echo "::error::package/server/calendar saknas — paketeringen är felaktig"; exit 1; }
          # Endast produktionsberoenden (node-ical, temporal-polyfill).
          npm ci --ignore-scripts --no-audit --no-fund --omit=dev
          cp -r node_modules package/node_modules
          node -e "const {createRequestListener}=require('./package/server/index.js'); const http=require('http'); const server=http.createServer(createRequestListener({root: require('path').resolve('./package/dist')})); server.listen(0, '127.0.0.1', () => server.close(() => console.log('paketet startar: OK')));"
          echo "Paketets storlek:" && du -sh package
      - name: Smoke-testa den paketerade applikationen
        run: node scripts/smoke-test.mjs ./package
      # OIDC-inloggning krävs innan webapps-deploy (annars "No credentials
      # found"). Ger kortlivad federerad token via den användartilldelade
      # Managed Identity — inga klienthemligheter.
      - name: Logga in på Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Driftsätt till Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: 'package'
