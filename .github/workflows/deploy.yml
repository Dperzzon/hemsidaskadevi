name: Deploy till Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appservice-deploy-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Ska matcha webAppName i infra/main.bicepparam.
  APP_NAME: 'hemsida-skadevi-prod'

jobs:
  test:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Installera beroenden (webbapp + API)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix api
      - name: Kör API-tester
        run: npm test --prefix api
      - name: Kör servertester
        run: node --test tests/server.test.js
      - name: Kör kalenderklienttester
        run: node --test tests/calendar-client.test.js

  build_and_deploy:
    name: Bygg och driftsätt
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera publish profile
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::GitHub-hemligheten AZURE_WEBAPP_PUBLISH_PROFILE saknas. Ladda ner publish profile från webbappen i Azure-portalen (Översikt -> Hämta publiceringsprofil) och lägg till den i repo-inställningarna enligt docs/driftsattning.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installera beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Paketera webbappen
        run: |
          mkdir -p build/api
          cp server.js package.json package-lock.json build/
          cp -r node_modules build/
          cp -r api/src build/api/
          cp index.html 404.html robots.txt sitemap.xml build/
          cp -r css js pages images build/
          node -e "const {createRequestListener}=require('./build/server.js'); const http=require('http'); const server=http.createServer(createRequestListener({})); server.listen(0, '127.0.0.1', () => server.close(() => console.log('paketet startar: OK')));"
          ls build/ | head -20
      - name: Driftsätt till Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: 'build'
