name: Deploy till Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appservice-deploy-main
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Ska matcha webAppName i infra/main.bicepparam.
  APP_NAME: 'hemsida-skadevi-prod'
  # User-assigned managed identity, klient och prenumeration som skapats via
  # infra/main.bicep (output githubIdentityClientId). Lägg till som
  # repo-variabler/secrets i GitHub-inställningarna, se docs/driftsattning.md.
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  test:
    name: Tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Installera beroenden (webbapp + API)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix api
      - name: Kör API-tester
        run: npm test --prefix api
      - name: Kör servertester
        run: node --test tests/server.test.js
      - name: Kör kalenderklienttester
        run: node --test tests/calendar-client.test.js

  build_and_deploy:
    name: Bygg och driftsätt
    needs: test
    runs-on: ubuntu-latest
    # id-token: write krävs för OIDC-tokenutbytet mot Azure (federated
    # identity credential). contents: read för checkout.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Kontrollera OIDC-konfiguration
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::GitHub-variablerna AZURE_CLIENT_ID, AZURE_TENANT_ID och AZURE_SUBSCRIPTION_ID saknas. Kör infra-deploymenten (den skapar id-github-actions-skadevi via OIDC) och lägg till clientId som AZURE_CLIENT_ID samt tenant-/prenumerations-ID som AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID i repo-inställningarna, se docs/driftsattning.md."
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installera beroenden
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Paketera webbappen
        run: |
          mkdir -p build/api
          cp server.js package.json package-lock.json build/
          cp -r node_modules build/
          cp -r api/src build/api/
          cp index.html 404.html robots.txt sitemap.xml build/
          cp -r css js pages images build/
          node -e "const {createRequestListener}=require('./build/server.js'); const http=require('http'); const server=http.createServer(createRequestListener({})); server.listen(0, '127.0.0.1', () => server.close(() => console.log('paketet startar: OK')));"
          ls build/ | head -20
      - name: Driftsätt till Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: 'build'
